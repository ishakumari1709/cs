services:
  - type: web
    name: customer-support-backend
    env: python
    pythonVersion: "3.11"
    buildCommand: export CARGO_HOME=/tmp/cargo && export RUSTUP_HOME=/tmp/rustup && export PIP_NO_BUILD_ISOLATION=1 && pip install --upgrade pip setuptools wheel && pip install numpy && pip install --prefer-binary --no-cache-dir -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: HUGGINGFACE_API_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
        # Set this to your Vercel frontend URL after deployment
        # Example: https://your-frontend.vercel.app

